<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <!-- Hexagon background -->
  <polygon points="32,4 56,4 68,25 56,46 32,46 20,25" fill="#005f73"/>
  <!-- Map grid lines (clipped to hexagon via path) -->
  <clipPath id="hexClip">
    <polygon points="32,4 56,4 68,25 56,46 32,46 20,25"/>
  </clipPath>
  <g clip-path="url(#hexClip)" opacity="0.3">
    <line x1="20" y1="14" x2="68" y2="14" stroke="white" stroke-width="1"/>
    <line x1="20" y1="22" x2="68" y2="22" stroke="white" stroke-width="1"/>
    <line x1="20" y1="30" x2="68" y2="30" stroke="white" stroke-width="1"/>
    <line x1="20" y1="38" x2="68" y2="38" stroke="white" stroke-width="1"/>
    <line x1="30" y1="4" x2="30" y2="46" stroke="white" stroke-width="1"/>
    <line x1="44" y1="4" x2="44" y2="46" stroke="white" stroke-width="1"/>
    <line x1="58" y1="4" x2="58" y2="46" stroke="white" stroke-width="1"/>
  </g>
  <!-- Data point marker -->
  <circle cx="44" cy="22" r="5" fill="#0096b7" clip-path="url(#hexClip)"/>
  <circle cx="44" cy="22" r="9" fill="none" stroke="#0096b7" stroke-width="1.5" opacity="0.6" clip-path="url(#hexClip)"/>
  <circle cx="44" cy="22" r="13" fill="none" stroke="#0096b7" stroke-width="1" opacity="0.3" clip-path="url(#hexClip)"/>
  <!-- Connection lines -->
  <line x1="44" y1="17" x2="38" y2="30" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8" clip-path="url(#hexClip)"/>
  <line x1="44" y1="17" x2="54" y2="32" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8" clip-path="url(#hexClip)"/>
  <circle cx="38" cy="30" r="2.5" fill="#4ecdc4" clip-path="url(#hexClip)"/>
  <circle cx="54" cy="32" r="2.5" fill="#4ecdc4" clip-path="url(#hexClip)"/>
  <!-- Text: GRIND -->
  <text x="82" y="31" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0d1b2a" letter-spacing="1">GRIND</text>
  <!-- Text: LAB -->
  <text x="83" y="46" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#005f73" letter-spacing="4">LAB</text>
</svg>
